name: Daily Check & Multi-Arch Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ============================================================
  # Job 1: check upstream
  # ============================================================
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.compare.outputs.new_release }}
      latest_tag: ${{ steps.get_latest.outputs.tag }}
      download_url: ${{ steps.get_latest.outputs.download_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: get_latest
        run: |
          RESP=$(curl -sL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rofl0r/microsocks/releases/latest)
          TAG=$(echo "$RESP" | jq -r '.tag_name')
          URL="https://github.com/rofl0r/microsocks/archive/refs/tags/${TAG}.zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest upstream: $TAG"

      - name: Compare and decide
        id: compare
        run: |
          LATEST="${{ steps.get_latest.outputs.tag }}"
          if [ -f .github/last_release_tag ]; then
            STORED=$(cat .github/last_release_tag)
          else
            STORED="none"
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${LATEST}")
          if [ "$HTTP" = "200" ]; then
            echo "SKIP: release ${LATEST} already exists"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" != "$STORED" ] && [ -n "$LATEST" ]; then
            echo "BUILD: $LATEST (was: $STORED)"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP: no new release"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Job 2: multi-arch build
  # ============================================================
  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux glibc (20 targets) ----
          - { name: linux-amd64,       type: apt, cc: gcc,                              pkg: "",                                 flags: "-static" }
          - { name: linux-i386,        type: apt, cc: gcc,                              pkg: "gcc-i686-linux-gnu",              flags: "-static -m32" }
          - { name: linux-arm64,       type: apt, cc: aarch64-linux-gnu-gcc,            pkg: "gcc-aarch64-linux-gnu",           flags: "-static" }
          - { name: linux-armv7,       type: apt, cc: arm-linux-gnueabihf-gcc,          pkg: "gcc-arm-linux-gnueabihf",         flags: "-static" }
          - { name: linux-armv6,       type: apt, cc: arm-linux-gnueabi-gcc,            pkg: "gcc-arm-linux-gnueabi",           flags: "-static" }
          - { name: linux-mips,        type: apt, cc: mips-linux-gnu-gcc,               pkg: "gcc-mips-linux-gnu",              flags: "-static" }
          - { name: linux-mipsel,      type: apt, cc: mipsel-linux-gnu-gcc,             pkg: "gcc-mipsel-linux-gnu",            flags: "-static" }
          - { name: linux-mips64,      type: apt, cc: mips64-linux-gnuabi64-gcc,        pkg: "gcc-mips64-linux-gnuabi64",       flags: "-static" }
          - { name: linux-mips64el,    type: apt, cc: mips64el-linux-gnuabi64-gcc,      pkg: "gcc-mips64el-linux-gnuabi64",     flags: "-static" }
          - { name: linux-riscv64,     type: apt, cc: riscv64-linux-gnu-gcc,            pkg: "gcc-riscv64-linux-gnu",           flags: "-static" }
          - { name: linux-powerpc,     type: apt, cc: powerpc-linux-gnu-gcc,            pkg: "gcc-powerpc-linux-gnu",           flags: "-static" }
          - { name: linux-powerpc64,   type: apt, cc: powerpc64-linux-gnu-gcc,          pkg: "gcc-powerpc64-linux-gnu",         flags: "-static" }
          - { name: linux-ppc64le,     type: apt, cc: powerpc64le-linux-gnu-gcc,        pkg: "gcc-powerpc64le-linux-gnu",       flags: "-static" }
          - { name: linux-s390x,       type: apt, cc: s390x-linux-gnu-gcc,              pkg: "gcc-s390x-linux-gnu",             flags: "-static" }
          - { name: linux-sparc64,     type: apt, cc: sparc64-linux-gnu-gcc,            pkg: "gcc-sparc64-linux-gnu",           flags: "-static" }
          - { name: linux-m68k,        type: apt, cc: m68k-linux-gnu-gcc,               pkg: "gcc-m68k-linux-gnu",              flags: "-static" }
          - { name: linux-alpha,       type: apt, cc: alpha-linux-gnu-gcc,              pkg: "gcc-alpha-linux-gnu",             flags: "-static" }
          - { name: linux-hppa,        type: apt, cc: hppa-linux-gnu-gcc,               pkg: "gcc-hppa-linux-gnu",              flags: "-static" }
          - { name: linux-sh4,         type: apt, cc: sh4-linux-gnu-gcc,                pkg: "gcc-sh4-linux-gnu",               flags: "-static" }
          - { name: linux-loongarch64, type: apt, cc: loongarch64-linux-gnu-gcc,        pkg: "gcc-loongarch64-linux-gnu",       flags: "-static" }

          # ---- Alpine / musl fully static (6 targets) ----
          - { name: alpine-amd64,      type: musl,      cc: musl-gcc,                         flags: "-static" }
          - { name: alpine-arm64,      type: dockcross,  image: dockcross/linux-arm64-musl,    cc: armv8-linux-musl-cc,           flags: "-static" }
          - { name: alpine-armv7,      type: dockcross,  image: dockcross/linux-armv7l-musl,   cc: armv7l-linux-musleabihf-cc,    flags: "-static" }
          - { name: alpine-armv6,      type: dockcross,  image: dockcross/linux-armv6-musl,    cc: armv6-linux-musleabihf-cc,     flags: "-static" }
          - { name: alpine-riscv64,    type: dockcross,  image: dockcross/linux-riscv64,       cc: riscv64-linux-gnu-gcc,         flags: "-static" }
          - { name: alpine-mips,       type: dockcross,  image: dockcross/linux-mips,          cc: mips-linux-gnu-gcc,            flags: "-static" }

          # ---- Windows mingw (3 targets) ----
          - { name: windows-amd64,     type: apt, cc: x86_64-w64-mingw32-gcc,    pkg: "gcc-mingw-w64-x86-64",  flags: "-static", suffix: ".exe" }
          - { name: windows-i386,      type: apt, cc: i686-w64-mingw32-gcc,      pkg: "gcc-mingw-w64-i686",    flags: "-static", suffix: ".exe" }
          - { name: windows-arm64,     type: apt, cc: aarch64-w64-mingw32-gcc,   pkg: "gcc-mingw-w64-arm64",   flags: "-static", suffix: ".exe" }

          # ---- macOS osxcross (2 targets) ----
          - { name: darwin-amd64,      type: osxcross, cc: o64-clang,  flags: "" }
          - { name: darwin-arm64,      type: osxcross, cc: oa64-clang, flags: "" }

          # ---- FreeBSD (3 targets) ----
          - { name: freebsd-amd64,     type: freebsd, target: x86_64-unknown-freebsd,    cc: clang }
          - { name: freebsd-arm64,     type: freebsd, target: aarch64-unknown-freebsd,    cc: clang }
          - { name: freebsd-i686,      type: freebsd, target: i686-unknown-freebsd,       cc: clang }

          # ---- NetBSD (2 targets) ----
          - { name: netbsd-amd64,      type: netbsd, target: x86_64-unknown-netbsd,      cc: x86_64-unknown-netbsd-gcc }
          - { name: netbsd-arm64,      type: netbsd, target: aarch64-unknown-netbsd,      cc: aarch64-unknown-netbsd-gcc }

          # ---- Android (3 targets) ----
          - { name: android-arm64,     type: android, target: aarch64-linux-android,      api: 21 }
          - { name: android-armv7,     type: android, target: armv7a-linux-androideabi,   api: 21 }
          - { name: android-x86_64,    type: android, target: x86_64-linux-android,       api: 21 }

    steps:
      # === common: download source ===
      - name: Download upstream source
        run: |
          curl -sL -o source.zip "${{ needs.check-upstream.outputs.download_url }}"
          unzip -q source.zip
          DIR=$(unzip -Z -1 source.zip | head -1 | cut -d/ -f1)
          mv "$DIR" src

      # === type: apt ===
      - name: "[apt] Install"
        if: matrix.type == 'apt'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          if [ -n "${{ matrix.pkg }}" ]; then
            sudo apt-get install -y -qq ${{ matrix.pkg }} || echo "pkg missing, skip"
          fi

      - name: "[apt] Build"
        if: matrix.type == 'apt'
        run: |
          cd src
          SUF="${{ matrix.suffix }}"
          BIN="microsocks-${{ matrix.name }}${SUF}"
          make CC="${{ matrix.cc }}" \
               CFLAGS="-Wall -std=c99 -O2 -s ${{ matrix.flags }}" \
               LDFLAGS="-s ${{ matrix.flags }}" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}" 2>/dev/null || cp microsocks.exe "../out/${BIN}" 2>/dev/null || true
          if [ -f "../out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"; fi

      # === type: musl ===
      - name: "[musl] Install"
        if: matrix.type == 'musl'
        run: sudo apt-get install -y -qq musl-tools

      - name: "[musl] Build"
        if: matrix.type == 'musl'
        run: |
          cd src
          BIN="microsocks-${{ matrix.name }}"
          make CC="musl-gcc" \
               CFLAGS="-Wall -std=c99 -O2 -s -static" \
               LDFLAGS="-s -static" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}"
          echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"

      # === type: dockcross ===
      - name: "[dockcross] Build"
        if: matrix.type == 'dockcross'
        run: |
          docker run --rm -v "$(pwd):/work" ${{ matrix.image }} \
            bash -c "cd /work/src && make CC='${{ matrix.cc }}' \
              CFLAGS='-Wall -std=c99 -O2 -s ${{ matrix.flags }}' \
              LDFLAGS='-s ${{ matrix.flags }}'" 2>&1 || exit 0
          BIN="microsocks-${{ matrix.name }}"
          mkdir -p out
          cp src/microsocks "out/${BIN}" 2>/dev/null || true
          if [ -f "out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "out/${BIN}") bytes)"; fi

      # === type: osxcross ===
      - name: "[osxcross] Setup"
        if: matrix.type == 'osxcross'
        uses: Timmmm/setup-osxcross@v2
        with:
          osx-version: "12.3"

      - name: "[osxcross] Build"
        if: matrix.type == 'osxcross'
        run: |
          cd src
          BIN="microsocks-${{ matrix.name }}"
          make CC="${{ matrix.cc }}" \
               CFLAGS="-Wall -std=c99 -O2 -s" \
               LDFLAGS="-s" LIBS="" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}" 2>/dev/null || true
          if [ -f "../out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"; fi

      # === type: freebsd ===
      - name: "[freebsd] Setup toolchain"
        if: matrix.type == 'freebsd'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: "[freebsd] Build"
        if: matrix.type == 'freebsd'
        run: |
          cd src
          BIN="microsocks-${{ matrix.name }}"
          make CC="${{ matrix.cc }} --target=${{ matrix.target }} --sysroot=${CROSS_ROOT}" \
               CFLAGS="-Wall -std=c99 -O2 -s" \
               LDFLAGS="-s" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}" 2>/dev/null || true
          if [ -f "../out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"; fi

      # === type: netbsd ===
      - name: "[netbsd] Setup toolchain"
        if: matrix.type == 'netbsd'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: "[netbsd] Build"
        if: matrix.type == 'netbsd'
        run: |
          cd src
          BIN="microsocks-${{ matrix.name }}"
          export PATH="${CROSS_ROOT}/bin:${PATH}"
          make CC="${{ matrix.cc }}" \
               CFLAGS="-Wall -std=c99 -O2 -s" \
               LDFLAGS="-s" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}" 2>/dev/null || true
          if [ -f "../out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"; fi

      # === type: android ===
      - name: "[android] Setup NDK"
        if: matrix.type == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: "[android] Build"
        if: matrix.type == 'android'
        run: |
          cd src
          BIN="microsocks-${{ matrix.name }}"
          TC="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="${TC}/bin/clang --target=${{ matrix.target }}${{ matrix.api }}"
          export AR="${TC}/bin/llvm-ar"
          export RANLIB="${TC}/bin/llvm-ranlib"
          make CC="$CC" \
               CFLAGS="-Wall -std=c99 -O2 -s -static -fPIE" \
               LDFLAGS="-s -static -fPIE -pie" 2>&1 || exit 0
          mkdir -p ../out
          cp microsocks "../out/${BIN}" 2>/dev/null || true
          if [ -f "../out/${BIN}" ]; then echo "OK: ${BIN} ($(wc -c < "../out/${BIN}") bytes)"; fi

      # === upload artifact ===
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsocks-${{ matrix.name }}
          path: out/

  # ============================================================
  # Job 3: create release
  # ============================================================
  release:
    needs: [check-upstream, build]
    if: always() && needs.check-upstream.outputs.new_release == 'true' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../checksums.txt
          echo "=== SHA256 ===" && cat ../checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-upstream.outputs.latest_tag }}
          name: "microsocks ${{ needs.check-upstream.outputs.latest_tag }} (multi-arch)"
          body_path: .github/release_body.md
          draft: false
          prerelease: false
          files: |
            artifacts/*
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stored tag
        run: |
          echo "${{ needs.check-upstream.outputs.latest_tag }}" > .github/last_release_tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_release_tag
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update last processed release to ${{ needs.check-upstream.outputs.latest_tag }}"
            git push
          fi
